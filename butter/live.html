<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ハタリス 声の検証</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#22302a;--sub:#5d6b64;--line:#dfe6e1;--hb:#62AD7F;--hbd:#3f8a5c;--stop:#d9483b}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--card:#1d2521;--ink:#e8efea;--sub:#a3b1aa;--line:#2f3a35;--hb:#6fbf8d;--hbd:#8fd3a8;--stop:#ef6b5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 18px}
.talk{display:block;width:100%;border:0;border-radius:999px;padding:18px;font-size:18px;font-weight:700;background:var(--hb);color:#fff;cursor:pointer}
.talk.on{background:var(--stop)}
.talk:disabled{opacity:.6}
.state{margin:12px 0 18px;text-align:center;color:var(--sub);font-size:14px;min-height:1.6em}
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:160px}
.row{margin:6px 0}
.row b{display:inline-block;min-width:3.5em;color:var(--hbd)}
.row.me b{color:var(--sub)}
.row.brain{font-size:13px;color:var(--sub)}
label{display:block;font-size:13px;color:var(--sub);margin-top:16px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
.note{font-size:12px;color:var(--sub);margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>ハタリス 声の検証（GPT-Live-1）</h1>
  <p class="sub">話すのは GPT-Live-1、むずかしい質問は Claude が考えて渡します。</p>
  <button class="talk" id="talk" type="button">話しはじめる</button>
  <div class="state" id="state">ボタンを押すと、マイクを使います</div>
  <div class="log" id="log" aria-live="polite"></div>
  <label for="name">あなたの呼び名（任意）</label>
  <input id="name" autocomplete="off" placeholder="例：ヒロ">
  <label for="key">合言葉</label>
  <input id="key" type="password" autocomplete="off">
  <p class="note">1回は15分まで。試したあとは「ここが遅い」「聞きまちがえた」を事務局に送ってください。</p>
</main>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const host = P.get('s') || 'butter-junior-722073142596.asia-northeast1.run.app';
  const $ = id => document.getElementById(id);
  const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  $('key').value = P.get('k') || get('liveKey'); $('name').value = get('liveName');
  let pc = null, dc = null, mic = null, rows = { me: null, hb: null };
  const state = t => { $('state').textContent = t; };
  function say(who, t) {
    const k = who === 'あなた' ? 'me' : 'hb';
    if (!rows[k]) { const d = document.createElement('div'); d.className = 'row ' + k; d.innerHTML = '<b></b><span></span>'; d.firstChild.textContent = who; $('log').appendChild(d); rows[k] = d; rows[k === 'me' ? 'hb' : 'me'] = null; }
    rows[k].lastChild.textContent += t; $('log').scrollTop = 1e9;
  }
  function note(t) { const d = document.createElement('div'); d.className = 'row brain'; d.textContent = t; $('log').appendChild(d); rows = { me: null, hb: null }; }
  async function start() {
    const k = $('key').value.trim(); if (!k) { state('合言葉を入れてください'); return; }
    put('liveKey', k); put('liveName', $('name').value.trim());
    $('talk').disabled = true; state('つないでいます…');
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      pc = new RTCPeerConnection();
      const au = new Audio(); au.autoplay = true; au.playsInline = true;
      pc.ontrack = e => { au.srcObject = e.streams[0]; au.play().catch(() => {}); };
      mic.getTracks().forEach(t => pc.addTrack(t, mic));
      dc = pc.createDataChannel('oai-events');
      dc.onmessage = ({ data }) => {
        let ev; try { ev = JSON.parse(data); } catch (e) { return; }
        if (ev.type === 'session.input_transcript.delta') say('あなた', ev.delta || '');
        else if (ev.type === 'session.output_transcript.delta') say('ハタボ', ev.delta || '');
        else if (ev.type === 'session.delegation.created') note('（頭のClaudeに考えてもらっています）');
        else if (ev.type === 'session.started') state('話しかけてください');
        else if (ev.type === 'session.closed') stop('おわりました');
        else if (ev.type === 'error') note('エラー：' + ((ev.error && ev.error.message) || ''));
      };
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
      const r = await fetch('https://' + host + '/live/session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k, sdp: offer.sdp, name: $('name').value.trim() }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.sdp) throw new Error(j.error || ('つなげませんでした（' + r.status + '）'));
      await pc.setRemoteDescription({ type: 'answer', sdp: j.sdp });
      $('talk').textContent = 'おわる'; $('talk').classList.add('on'); $('talk').disabled = false; state('話しかけてください');
    } catch (e) { stop(String(e.message || e)); }
  }
  function stop(why) {
    try { if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ type: 'session.close', event_id: 'bye' })); } catch (e) {}
    setTimeout(() => { try { pc && pc.close(); } catch (e) {} pc = null; }, 800);
    if (mic) mic.getTracks().forEach(t => t.stop()); mic = null; dc = null;
    $('talk').textContent = '話しはじめる'; $('talk').classList.remove('on'); $('talk').disabled = false;
    state(why || 'おわりました');
  }
  $('talk').onclick = () => pc ? stop() : start();
})();
</script>
</body>
</html>
